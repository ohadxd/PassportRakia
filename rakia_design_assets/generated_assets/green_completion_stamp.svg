<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-label="Mission completed stamp">
  <defs>
    <filter id="roughen">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
    </filter>
  </defs>
  <g transform="rotate(-9 260 260)" filter="url(#roughen)" opacity=".92">
    <circle cx="260" cy="260" r="215" fill="none" stroke="#0f6b3f" stroke-width="18"/>
    <circle cx="260" cy="260" r="176" fill="none" stroke="#0f6b3f" stroke-width="5" stroke-dasharray="10 12"/>
    <circle cx="260" cy="260" r="112" fill="none" stroke="#0f6b3f" stroke-width="7"/>
